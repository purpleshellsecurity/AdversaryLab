name: Validate Bicep Templates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege by default; iac-scan opts into security-events below.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bicep-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Bicep
        run: |
          az bicep install
          az bicep version

      - name: Validate main.bicep
        run: az bicep build --file main.bicep

      - name: Validate main_subscription.bicep
        run: az bicep build --file main_subscription.bicep

      - name: Validate all modules
        run: |
          for f in modules/*.bicep; do
            echo "Checking $f..."
            az bicep build --file "$f"
          done

  powershell-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

          # Only genuinely noisy rules are excluded. The ShouldProcess and
          # ApprovedVerbs rules are enforced: -WhatIf correctness is a safety
          # contract for installers, and per-function exceptions use targeted
          # [SuppressMessageAttribute] with a justification instead.
          $excludeRules = @(
            'PSAvoidUsingWriteHost',
            'PSAvoidUsingInvokeExpression',
            'PSReviewUnusedParameter',
            'PSAvoidUsingPlainTextForPassword',
            'PSAvoidUsingConvertToSecureStringWithPlainText',
            'PSUseSingularNouns',
            'PSUseBOMForUnicodeEncodedFile'
          )

          $results = Invoke-ScriptAnalyzer `
            -Path . `
            -Recurse `
            -Severity Warning,Error `
            -ExcludeRule $excludeRules

          if ($results) {
            $results | Format-Table -AutoSize
            Write-Host "PSScriptAnalyzer found $($results.Count) issue(s)" -ForegroundColor Red
            exit 1
          }

          Write-Host "No issues found!" -ForegroundColor Green

  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets with TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

  iac-scan:
    runs-on: ubuntu-latest
    needs: bicep-validate

    # Checkov audits, it does not gate: soft_fail keeps the build green.
    # Results are uploaded to Security > Code scanning so they are visible and
    # individually dismissible instead of scrolling past in a job log.
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: bicep
          soft_fail: true
          output_format: cli,sarif
          output_file_path: console,results.sarif

      # always(): upload even when the scan step reports findings, otherwise a
      # run with results would publish nothing.
      - name: Upload Checkov results to code scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif
          category: checkov
